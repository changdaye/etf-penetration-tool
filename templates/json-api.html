<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF 穿透分析 - JSON API 版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            padding: 20px; 
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            background: white; 
            border-radius: 16px; 
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); 
            overflow: hidden; 
        }
        header { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            padding: 30px; 
            text-align: center; 
        }
        header h1 { font-size: 2em; margin-bottom: 10px; }
        header p { opacity: 0.9; }
        main { padding: 30px; }
        
        .api-section {
            background: #f8f9ff;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .api-section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        textarea {
            width: 100%;
            min-height: 200px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 13px;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
        }
        .btn-primary:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); 
        }
        .btn-secondary { 
            background: #f0f0f0; 
            color: #333; 
            margin-left: 10px;
        }
        .btn-secondary:hover { 
            background: #e0e0e0; 
        }
        
        .result-section {
            display: none;
            margin-top: 20px;
        }
        .result-section.show {
            display: block;
        }
        .result-box {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
        }
        .result-box pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .result-box code {
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 13px;
        }
        
        .status-success { color: #4caf50; }
        .status-error { color: #f44336; }
        
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }
        .loading.show { display: block; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .tabs {
            display: flex;
            margin-bottom: 15px;
        }
        .tab {
            padding: 10px 20px;
            background: #e0e0e0;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .tab:first-child {
            border-radius: 8px 0 0 8px;
        }
        .tab:last-child {
            border-radius: 0 8px 8px 0;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }
        
        .example-btn {
            margin-top: 10px;
            font-size: 13px;
            padding: 8px 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 ETF 穿透分析 - JSON API 版</h1>
            <p>上传 JSON 数据，获取 JSON 分析结果</p>
        </header>
        
        <main>
            <div class="api-section">
                <h2>🔧 API 接口选择</h2>
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('full')">一键分析</button>
                    <button class="tab" onclick="switchTab('upload')">分步 - 上传</button>
                    <button class="tab" onclick="switchTab('analyze')">分步 - 分析</button>
                </div>
                
                <div class="input-group">
                    <label for="jsonInput">JSON 数据：</label>
                    <textarea id="jsonInput" placeholder='请输入 JSON 数据...'></textarea>
                    <button class="btn btn-secondary example-btn" onclick="loadExample()">📋 加载示例数据</button>
                </div>
                
                <button class="btn btn-primary" onclick="sendRequest()">🚀 发送请求</button>
                <button class="btn btn-secondary" onclick="clearAll()">🗑️ 清空</button>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在分析 ETF 持仓...</p>
            </div>
            
            <div class="result-section" id="resultSection">
                <h2>📋 分析结果</h2>
                <div class="result-box">
                    <pre><code id="resultCode"></code></pre>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        let currentTab = 'full';
        const BASE_URL = '';
        
        const examples = {
            full: {
                "positions": [
                    {
                        "code": "513050",
                        "name": "易方达中证海外互联 ETF",
                        "holding_amount": 50000.00
                    },
                    {
                        "code": "159915",
                        "name": "易方达创业板 ETF",
                        "holding_amount": 30000.00
                    },
                    {
                        "code": "510300",
                        "name": "华泰柏瑞沪深 300ETF",
                        "holding_amount": 40000.00
                    }
                ]
            },
            upload: {
                "positions": [
                    {
                        "code": "513050",
                        "name": "易方达中证海外互联 ETF",
                        "holding_amount": 50000.00,
                        "total_profit": 5000.00,
                        "holding_profit": 3000.00
                    },
                    {
                        "code": "159915",
                        "name": "易方达创业板 ETF",
                        "holding_amount": 30000.00
                    }
                ],
                "total_holding_amount": 80000.00
            },
            analyze: {
                "etf_list": [
                    {
                        "code": "513050",
                        "name": "易方达中证海外互联 ETF",
                        "amount": 50000
                    },
                    {
                        "code": "159915",
                        "name": "易方达创业板 ETF",
                        "amount": 30000
                    }
                ],
                "total_amount": 80000
            }
        };
        
        const endpoints = {
            full: '/api/full-json-analysis',
            upload: '/api/json-upload',
            analyze: '/api/json-analyze'
        };
        
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            loadExample();
        }
        
        function loadExample() {
            const example = examples[currentTab];
            document.getElementById('jsonInput').value = JSON.stringify(example, null, 2);
        }
        
        function clearAll() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('resultSection').classList.remove('show');
            document.getElementById('resultCode').textContent = '';
        }
        
        async function sendRequest() {
            const jsonInput = document.getElementById('jsonInput').value.trim();
            
            if (!jsonInput) {
                alert('请输入 JSON 数据');
                return;
            }
            
            let data;
            try {
                data = JSON.parse(jsonInput);
            } catch (e) {
                alert(`JSON 格式错误：${e.message}`);
                return;
            }
            
            const endpoint = endpoints[currentTab];
            const loading = document.getElementById('loading');
            const resultSection = document.getElementById('resultSection');
            const resultCode = document.getElementById('resultCode');
            
            loading.classList.add('show');
            resultSection.classList.remove('show');
            
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                resultCode.textContent = JSON.stringify(result, null, 2);
                
                if (result.success) {
                    resultCode.className = 'status-success';
                } else {
                    resultCode.className = 'status-error';
                }
                
                resultSection.classList.add('show');
            } catch (error) {
                alert(`请求失败：${error.message}`);
            } finally {
                loading.classList.remove('show');
            }
        }
        
        // 初始化加载示例
        loadExample();
    </script>
</body>
</html>
